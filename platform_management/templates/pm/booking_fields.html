<label for="slot">Homepage slot</label>
<select id="slot" name="slot">{% for n in range(1,7) %}<option value="{{ n }}" {% if request.form.get('slot',item.slot if item else 1)|string==n|string %}selected{% endif %}>{{ n }}</option>{% endfor %}</select>
<label for="starts_at">Start — Singapore time</label>
<input type="datetime-local" name="starts_at" id="starts_at" required value="{{ request.form.get('starts_at',item.start_local|replace(' ','T') if item else '') }}">
<label for="ends_at">End — Singapore time</label>
<input type="datetime-local" name="ends_at" id="ends_at" required value="{{ request.form.get('ends_at',item.end_local|replace(' ','T') if item else '') }}">
<label for="reason">Reason</label>
<textarea name="reason" id="reason" minlength="5" maxlength="1000" rows="3" required>{{ request.form.get('reason',item.reason if item else '') }}</textarea>
<button name="action" value="save">{{ 'Save booking changes' if item else 'Schedule placement' }}</button>
