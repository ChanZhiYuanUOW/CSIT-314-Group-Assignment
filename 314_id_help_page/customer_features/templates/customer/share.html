{% extends "customer/_layout.html" %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
<div class="card"><div class="card-body">
  <h4 class="fw-bold">Share project link</h4>
  <p class="text-muted">Anyone with this link can view <strong>{{ project.title }}</strong> without logging in. The link stops working if the project is unpublished.</p>
  <div class="input-group mb-3">
    <input id="shareLink" class="form-control" value="{{ link }}" readonly aria-label="Share link">
    <button class="btn btn-primary" type="button" id="copyBtn">Copy link</button>
  </div>
  <div class="d-flex flex-wrap gap-2 mb-3">
    <a class="btn btn-outline-secondary btn-sm" href="mailto:?subject={{ ('Interior design project: ' ~ project.title)|urlencode }}&body={{ ('Take a look at this project: ' ~ link)|urlencode }}">&#9993; Email</a>
    <a class="btn btn-outline-success btn-sm" target="_blank" rel="noopener" href="https://wa.me/?text={{ ('Check out this interior design project: ' ~ link)|urlencode }}">WhatsApp</a>
  </div>
  <a href="{{ url_for('customer.viewProjectDetails', project_id=project.id) }}">&larr; Back to project</a>
</div></div>
</div></div>
<script>
document.getElementById('copyBtn').addEventListener('click', async function () {
  var input = document.getElementById('shareLink'), btn = this;
  try { await navigator.clipboard.writeText(input.value); }
  catch (e) { input.select(); document.execCommand('copy'); }
  btn.textContent = 'Copied!';
  setTimeout(function () { btn.textContent = 'Copy link'; }, 2000);
});
</script>
{% endblock %}
