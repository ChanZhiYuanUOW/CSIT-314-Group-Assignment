{% extends 'pm/base.html' %}{% from 'pm/macros.html' import csrf %}{% block content %}<h1>{{ 'Edit' if item else 'Create' }} Project Category</h1><section class="card"><form method="post">{{ csrf() }}<label for="name">Name</label><input id="name" name="name" maxlength="80" required value="{{ request.form.get('name',item.name if item else '') }}"><label for="description">Description</label><textarea id="description" name="description" maxlength="240" rows="3">{{ request.form.get('description',item.description if item else '') }}</textarea><div class="actions"><button>Save category</button><a href="{{ url_for('pm.categories') }}">Cancel</a></div></form></section>{% endblock %}
