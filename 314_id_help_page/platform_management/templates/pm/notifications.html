{% extends 'pm/base.html' %}{% from 'pm/macros.html' import csrf %}{% block content %}<h1>Your notifications</h1><section class="card"><form method="post">{{ csrf() }}<button>Mark all as read</button></form>{% for r in items %}<div class="list-row"><div><p>{{ r.message }}</p><small>{{ r.created_at }} UTC · {{ 'Read' if r.is_read else 'Unread' }}</small></div></div>{% else %}<p>No notifications.</p>{% endfor %}</section>{% endblock %}
