{% extends 'pm/base.html' %}{% from 'pm/macros.html' import csrf %}{% block content %}<h1>{{ 'Edit' if item else 'Create' }} featured schedule</h1><section class="card"><form method="post">{{ csrf() }}<label for="project_id">Published project</label><select name="project_id" id="project_id" required>{% for p in projects %}<option value="{{ p.id }}" {% if request.form.get('project_id',item.project_id if item else '')|string==p.id|string %}selected{% endif %}>#{{ p.id }} — {{ p.title }}</option>{% endfor %}</select><label for="slot">Homepage slot</label><select id="slot" name="slot">{% for n in range(1,7) %}<option value="{{ n }}" {% if request.form.get('slot',item.slot if item else 1)|string==n|string %}selected{% endif %}>{{ n }}</option>{% endfor %}</select><label for="starts_at">Start — Singapore time</label><input type="datetime-local" name="starts_at" id="starts_at" required value="{{ request.form.get('starts_at',item.start_local|replace(' ','T') if item else '') }}"><label for="ends_at">End — Singapore time</label><input type="datetime-local" name="ends_at" id="ends_at" required value="{{ request.form.get('ends_at',item.end_local|replace(' ','T') if item else '') }}"><label for="reason">Reason</label><textarea name="reason" id="reason" minlength="5" maxlength="1000" rows="3" required>{{ request.form.get('reason',item.reason if item else '') }}</textarea><button name="action" value="save">Save booking</button></form>{% if item %}<hr><p>Current status: {{ item.display_state }}. Cancelled and expired bookings are read-only.</p><form method="post">{{ csrf() }}<input type="hidden" name="action" value="cancel"><label>Cancellation reason<input name="reason" required minlength="5" maxlength="1000"></label><button class="danger">Cancel booking</button></form>{% endif %}</section>{% endblock %}
