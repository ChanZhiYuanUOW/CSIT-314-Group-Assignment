{% macro csrf() %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% endmacro %}
{% macro action_form(options, report_ids=none) %}<form method="post">{{ csrf() }}{% if report_ids is not none %}<input type="hidden" name="report_ids" value="{{ report_ids|join(',') }}">{% endif %}<label for="action">Action</label><select name="action" id="action" required>{% for value,label in options %}<option value="{{ value }}" {% if request.form.get('action')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><label for="reason">Decision reason</label><textarea name="reason" id="reason" minlength="5" maxlength="1000" rows="4" required>{{ request.form.get('reason','') }}</textarea><p class="muted">This decision will be recorded in the activity log. Removal retains the record for audit history.</p><button>Confirm decision</button></form>{% endmacro %}
